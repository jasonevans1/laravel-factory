name: dependency-fix

# Claude fallback for Dependabot (reusable, scheduled; not Dependabot-triggered,
# so it has normal secrets).
#   sensor      open Dependabot PRs with a failed check, not yet attempted
#   controller  the oldest one
#   actuator    Claude + dependency-fix skill: fix app code, never the manifests
#   post-check  tests + diff guard + strict test-integrity (deterministic)
# One attempt per PR (label dependency-fix-attempted), so a PR Claude can't fix
# is left for you instead of burning quota every night.

on:
  workflow_call:
    inputs:
      factory-ref:
        type: string
        default: v1
      factory-repo:
        type: string
        default: jasonevans1/laravel-factory
      php-version:
        type: string
        default: "8.4"
      test-command:
        type: string
        default: vendor/bin/pest
      claude-timeout-minutes:
        type: string
        default: "30"
    secrets:
      FACTORY_APP_ID:
        required: true
      FACTORY_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: dependency-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FACTORY_OUT: ${{ github.workspace }}/../factory-out
      FACTORY_TEST_CMD: ${{ inputs.test-command }}
    steps:
      - id: target
        name: Sensor + controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$FACTORY_OUT"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --app dependabot --state open --limit 100 \
                 --json number,headRefName,headRefOid,createdAt,labels,statusCheckRollup \
            | jq -c '[.[]
                | select([.labels[].name] | index("dependency-fix-attempted") | not)
                | select([.statusCheckRollup[] | (.conclusion // .state)] | index("FAILURE"))]
              | sort_by(.createdAt) | .[0] // empty')
          if [ -z "$pr" ]; then
            echo "No failing, unattempted Dependabot PRs." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          branch=$(jq -r .headRefName <<<"$pr")
          sha=$(jq -r .headRefOid <<<"$pr")
          echo "Next: #$number ($branch)" | tee -a "$GITHUB_STEP_SUMMARY"
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$sha" --status failure \
                     --json databaseId --jq '.[0].databaseId')
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed | tail -n 300 > "$FACTORY_OUT/ci-failure.log" || true
          { echo "number=$number"; echo "branch=$branch"; } >> "$GITHUB_OUTPUT"

      - if: steps.target.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - if: steps.target.outputs.number != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory-repo }}
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false

      - if: steps.target.outputs.number != ''
        uses: ./.factory/.github/actions/setup-app
        with:
          php-version: ${{ inputs.php-version }}

      - id: auth
        if: steps.target.outputs.number != ''
        uses: ./.factory/.github/actions/app-auth
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      - id: mark
        if: steps.target.outputs.number != ''
        name: Mark attempted (one attempt per PR)
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          gh label create dependency-fix-attempted --color C5DEF5 --description "dependency-fix loop tried this PR" 2>/dev/null || true
          gh pr edit "$NUMBER" --add-label dependency-fix-attempted
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: claude
        if: steps.target.outputs.number != ''
        uses: ./.factory/.github/actions/claude
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          protected-paths: composer.json,composer.lock,package.json,package-lock.json,phpstan.neon
          timeout-minutes: ${{ inputs.claude-timeout-minutes }}
          prompt: |
            Use the laravel-factory:dependency-fix skill.
            This branch is a Dependabot PR (#${{ steps.target.outputs.number }}) whose CI fails.
            The failing CI log is in ${{ env.FACTORY_OUT }}/ci-failure.log; `git log -1 -p -- composer.lock package-lock.json` shows the upgrade.
            Test command: ${{ inputs.test-command }}
            You are running unattended in CI: do not ask for approval, do not commit, do not push.

      - name: Commit + post-check (deterministic)
        if: steps.target.outputs.number != ''
        env:
          BASE: ${{ steps.mark.outputs.base }}
        run: |
          git add -A
          git commit -m "fix: adapt app code to dependency upgrade" || { echo "::error::Claude made no changes."; exit 1; }
          php .factory/scripts/diff-guard.php --base "$BASE" \
            --deny composer.json --deny composer.lock --deny package.json --deny package-lock.json --deny phpstan.neon
          php .factory/scripts/test-integrity.php "$BASE" HEAD --strict
          $FACTORY_TEST_CMD

      - name: Push to the Dependabot branch
        if: steps.target.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
          NUMBER: ${{ steps.target.outputs.number }}
          CLAUDE_MSG: ${{ steps.claude.outputs.final-message }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:$BRANCH"
          { echo "### dependency-fix"; echo; cat "$CLAUDE_MSG" 2>/dev/null; echo; echo "resolved-by: claude (review manually; never auto-merged)"; } > "$FACTORY_OUT/comment.md"
          gh pr comment "$NUMBER" --body-file "$FACTORY_OUT/comment.md"
          # A Claude-fixed PR must be reviewed: cancel any auto-merge already enabled.
          gh pr merge "$NUMBER" --disable-auto 2>/dev/null || true
          echo "resolved-by: claude (#$NUMBER)" >> "$GITHUB_STEP_SUMMARY"
